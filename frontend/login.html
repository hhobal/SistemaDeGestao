<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — GestãoPro</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-icon"><i class="fa-solid fa-screwdriver-wrench"></i></div>
      <h1>GestãoPro</h1>
      <p>Sistema de Gestão de Serviços</p>
      <div id="loginErro"></div>
      <div class="login-form-group">
        <label>Usuário</label>
        <input type="text" id="usuario" placeholder="Digite seu usuário" autocomplete="username">
      </div>
      <div class="login-form-group">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-primary" onclick="login()">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar
      </button>
      <p style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:20px">
        Padrão: <strong>admin</strong> / <strong>admin123</strong>
      </p>
    </div>
  </div>
<script src="js/seguranca.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/tema.js"></script>
<script>
  // Stub leve só para mostrarNotificacao não quebrar nesta tela
  // (o toast completo só existe depois que app.js carrega, no painel).
  function mostrarNotificacao(msg) { console.log(msg); }
</script>
<script src="js/login.js"></script>

</body>
</html>
