<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Conta — Loja</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0f12;--bg2:#161a20;--card:#1e2430;--hover:#252d3a;--text:#e8eaf0;--muted:#8b93a7;--dim:#555e70;--accent:#4f8ef7;--accent2:#8b5cf6;--success:#34d399;--danger:#f87171;--warning:#fbbf24;--border:#2a3040}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.container{width:100%;max-width:440px;margin:0 auto}
.container.wide{max-width:760px}
.center-wrap{min-height:calc(100vh - 32px);display:flex;align-items:center;justify-content:center}
.logo{text-align:center;margin-bottom:24px}
.logo-icon{width:54px;height:54px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;margin:0 auto 12px;box-shadow:0 8px 20px rgba(79,142,247,.35)}
.logo h1{font-size:21px;font-weight:800}
.logo p{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.tabs{display:flex;gap:0;margin-bottom:24px;background:var(--bg2);border-radius:10px;padding:4px}
.tab{flex:1;padding:9px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border-radius:7px;border:none;background:transparent;color:var(--muted);transition:all .2s}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.form-group label{font-size:12px;font-weight:500;color:var(--muted)}
input{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:9px;font-size:13px;font-family:inherit;width:100%;transition:border-color .2s}
input:focus{outline:none;border-color:var(--accent)}
input::placeholder{color:var(--dim)}
input.erro{border-color:var(--danger)}
.btn{width:100%;padding:11px;border:none;border-radius:9px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-primary:disabled{background:var(--dim);cursor:not-allowed;transform:none;filter:none}
.btn-secundario{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-secundario:hover{background:var(--hover);color:var(--text)}
.msg-erro{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--danger);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.msg-ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);color:var(--success);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.voltar{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.voltar a{color:var(--accent);text-decoration:none}

/* PEDIDOS */
.topo-conta{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.topo-conta h2{font-size:19px;font-weight:800}
.resumo-conta{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.resumo-card{flex:1;min-width:110px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.resumo-card b{display:block;font-size:19px;font-weight:800}
.resumo-card span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

.filtros-pedido{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filtros-pedido input{flex:1;min-width:160px}
.status-chip{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:6px 13px;border-radius:99px;font-size:11.5px;cursor:pointer;transition:all .2s;font-weight:500}
.status-chip.active,.status-chip:hover{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}

.pedido-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px;transition:all .2s;cursor:pointer}
.pedido-card:hover{border-color:var(--accent)}
.pedido-card-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.pedido-numero{font-weight:800;color:var(--accent);font-size:14px}
.pedido-data{font-size:11px;color:var(--dim)}
.pedido-status{font-size:11px;padding:4px 11px;border-radius:99px;font-weight:700}
.st-pendente{background:rgba(251,191,36,.15);color:var(--warning)}
.st-processando{background:rgba(79,142,247,.15);color:var(--accent)}
.st-enviado{background:rgba(139,92,246,.15);color:var(--accent2)}
.st-entregue{background:rgba(52,211,153,.15);color:var(--success)}
.st-cancelado{background:rgba(248,113,113,.15);color:var(--danger)}
.pedido-itens{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.6}
.pedido-itens-lista{display:none;margin:8px 0;padding:10px 12px;background:var(--bg2);border-radius:8px}
.pedido-itens-lista.aberto{display:block}
.pedido-item-linha{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--border)}
.pedido-item-linha:last-child{border-bottom:none}
.pedido-rodape{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.pedido-total{font-weight:800;color:var(--success)}
.pedido-expandir{font-size:11px;color:var(--accent);display:flex;align-items:center;gap:4px}
.progress-track{display:flex;gap:4px;margin:10px 0}
.progress-seg{flex:1;height:4px;border-radius:99px;background:var(--border)}
.progress-seg.ativo{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.progress-seg.cancelado{background:var(--danger)}

.vazio{text-align:center;padding:48px 20px;color:var(--muted);font-size:13px}
.vazio i{font-size:38px;display:block;margin-bottom:12px;opacity:.3}
.skel{background:var(--card);border:1px solid var(--border);border-radius:12px;height:96px;margin-bottom:12px;overflow:hidden;position:relative}
.skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);animation:sh 1.3s infinite}
@keyframes sh{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
</style>
</head>
<body>

<!-- ═══════════ TELA DE LOGIN / CADASTRO (cliente deslogado) ═══════════ -->
<div class="center-wrap" id="telaAuth">
<div class="container">
  <div class="logo">
    <div class="logo-icon"><i class="fa-solid fa-bag-shopping"></i></div>
    <h1>GestãoPro Loja</h1>
    <p>Acesse sua conta para finalizar a compra</p>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="mostrarTab('login')">Entrar</button>
      <button class="tab" id="tabCadastro" onclick="mostrarTab('cadastro')">Criar conta</button>
    </div>

    <!-- LOGIN -->
    <div id="painelLogin">
      <div class="msg-erro" id="erroLogin"></div>
      <div class="form-group"><label>E-mail</label><input type="email" id="loginEmail" placeholder="seu@email.com"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="loginSenha" placeholder="••••••••"></div>
      <button class="btn btn-primary" id="btnLogin" onclick="fazerLogin()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar</button>
    </div>

    <!-- CADASTRO -->
    <div id="painelCadastro" style="display:none">
      <div class="msg-erro" id="erroCadastro"></div>
      <div class="msg-ok"   id="okCadastro"></div>
      <div class="form-group"><label>Nome completo</label><input type="text" id="cadNome" placeholder="Seu nome"></div>
      <div class="form-group"><label>E-mail</label><input type="email" id="cadEmail" placeholder="seu@email.com"></div>
      <div class="form-group"><label>Telefone</label><input type="text" id="cadTelefone" placeholder="(00) 00000-0000"></div>
      <div class="form-group"><label>CPF</label><input type="text" id="cadCpf" placeholder="000.000.000-00"></div>
      <div class="form-group"><label>Endereço de entrega</label><input type="text" id="cadEndereco" placeholder="Rua, número, bairro, cidade"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="cadSenha" placeholder="Mínimo 6 caracteres"></div>
      <button class="btn btn-primary" id="btnCadastro" onclick="fazerCadastro()"><i class="fa-solid fa-user-plus"></i> Criar conta</button>
    </div>
  </div>
  <div class="voltar"><a href="loja.html"><i class="fa-solid fa-arrow-left"></i> Voltar à loja</a></div>
</div>
</div>

<!-- ═══════════ TELA "MINHA CONTA" (cliente logado) ═══════════ -->
<div class="container wide" id="telaConta" style="display:none;padding-top:24px">
  <div class="topo-conta">
    <div>
      <h2 id="contaNomeCliente">Minha conta</h2>
      <p class="t-12 t-mudo" id="contaEmailCliente"></p>
    </div>
    <div style="display:flex;gap:8px">
      <a class="btn btn-secundario" href="loja.html" style="width:auto;padding:9px 14px"><i class="fa-solid fa-bag-shopping"></i> Loja</a>
      <button class="btn btn-secundario" style="width:auto;padding:9px 14px" onclick="fazerLogoutConta()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
    </div>
  </div>

  <div class="resumo-conta" id="resumoConta"></div>

  <div class="filtros-pedido" id="filtrosPedido">
    <input type="text" id="buscaPedido" placeholder="Buscar por número ou produto…" oninput="renderizarPedidosFiltrados()">
  </div>
  <div class="filtros-pedido" id="statusChips"></div>

  <h3 style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--muted)">Meus pedidos</h3>
  <div id="listaPedidosCliente"></div>
</div>

<script src="js/seguranca.js"></script>
<script src="js/config.js"></script>
<script src="js/loja-api.js"></script>
<script>
// ======================================
// CONTA DO CLIENTE — LOGIN / CADASTRO / PEDIDOS
// ======================================
// Login e cadastro usam POST /api/loja/auth/registrar e /api/loja/auth/login
// (hash bcrypt + JWT próprio da loja). Filtro/busca de pedidos abaixo é
// só client-side sobre o que GET /api/loja/pedidos já devolve — não existe
// endpoint de busca no backend, então isso não faz nenhuma chamada extra.

const REDIRECT = sessionStorage.getItem('loja_redirect') || 'loja.html';
let pedidosCliente = [];
let statusFiltro = '';

document.addEventListener('DOMContentLoaded', () => {
  if (lojaClienteLogado()) {
    mostrarTelaConta();
  } else {
    document.getElementById('telaAuth').style.display = '';
  }
});

function mostrarTab(t) {
  document.getElementById('painelLogin').style.display   = t==='login'    ? '' : 'none';
  document.getElementById('painelCadastro').style.display= t==='cadastro' ? '' : 'none';
  document.getElementById('tabLogin').classList.toggle('active',   t==='login');
  document.getElementById('tabCadastro').classList.toggle('active', t==='cadastro');
}

function erroMsg(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

async function fazerLogin() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const senha = document.getElementById('loginSenha').value.trim();
  erroMsg('erroLogin','');
  if (!email || !senha) { erroMsg('erroLogin','Preencha e-mail e senha.'); return; }

  const btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';

  try {
    await lojaLogin(email, senha);
    if (sessionStorage.getItem('loja_redirect')) {
      window.location.href = REDIRECT;
    } else {
      mostrarTelaConta();
    }
  } catch (erro) {
    erroMsg('erroLogin', erro.message || 'E-mail ou senha incorretos.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar';
  }
}

function mascaraTel(el) {
  let v = el.value.replace(/\D/g,'').slice(0,11);
  if (v.length>6) v=`(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
  else if (v.length>2) v=`(${v.slice(0,2)}) ${v.slice(2)}`;
  else if (v.length>0) v=`(${v}`;
  el.value = v;
}
function mascaraCPF(el) {
  let v = el.value.replace(/\D/g,'').slice(0,11);
  if(v.length>9) v=`${v.slice(0,3)}.${v.slice(3,6)}.${v.slice(6,9)}-${v.slice(9)}`;
  else if(v.length>6) v=`${v.slice(0,3)}.${v.slice(3,6)}.${v.slice(6)}`;
  else if(v.length>3) v=`${v.slice(0,3)}.${v.slice(3)}`;
  el.value=v;
}
document.getElementById('cadTelefone').addEventListener('input', function(){ mascaraTel(this); });
document.getElementById('cadCpf').addEventListener('input', function(){ mascaraCPF(this); });

async function fazerCadastro() {
  const nome     = document.getElementById('cadNome').value.trim();
  const email    = document.getElementById('cadEmail').value.trim().toLowerCase();
  const telefone = document.getElementById('cadTelefone').value.trim();
  const cpf      = document.getElementById('cadCpf').value.trim();
  const endereco = document.getElementById('cadEndereco').value.trim();
  const senha    = document.getElementById('cadSenha').value.trim();

  erroMsg('erroCadastro','');
  erroMsg('okCadastro','');

  if (!nome||!email||!senha) { erroMsg('erroCadastro','Nome, e-mail e senha são obrigatórios.'); return; }
  if (senha.length < 6)      { erroMsg('erroCadastro','Senha deve ter pelo menos 6 caracteres.'); return; }

  const btn = document.getElementById('btnCadastro');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Criando conta...';

  try {
    await lojaRegistrar({ nome, email, telefone, cpf, endereco, senha });

    const okEl = document.getElementById('okCadastro');
    okEl.textContent = 'Conta criada com sucesso! Redirecionando…';
    okEl.style.display = 'block';
    setTimeout(() => {
      if (sessionStorage.getItem('loja_redirect')) {
        window.location.href = REDIRECT;
      } else {
        mostrarTelaConta();
      }
    }, 1000);
  } catch (erro) {
    erroMsg('erroCadastro', erro.message || 'Não foi possível criar a conta.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Criar conta';
  }
}

document.getElementById('loginSenha').addEventListener('keypress', e => { if(e.key==='Enter') fazerLogin(); });

// ─── TELA "MINHA CONTA" / PEDIDOS ────────

async function mostrarTelaConta() {
  document.getElementById('telaAuth').style.display = 'none';
  document.getElementById('telaConta').style.display = '';
  document.getElementById('listaPedidosCliente').innerHTML = Array.from({length:3}).map(()=>'<div class="skel"></div>').join('');

  let cliente = lojaCarregarCliente();
  try {
    cliente = await lojaCarregarPerfil();
  } catch {
    lojaLogout();
    document.getElementById('telaConta').style.display = 'none';
    document.getElementById('telaAuth').style.display = '';
    return;
  }

  document.getElementById('contaNomeCliente').textContent = `Olá, ${cliente.nome.split(' ')[0]}`;
  document.getElementById('contaEmailCliente').textContent = cliente.email;

  await carregarPedidosCliente();
}

async function carregarPedidosCliente() {
  const container = document.getElementById('listaPedidosCliente');
  try {
    pedidosCliente = await lojaMeusPedidos();
    montarResumoConta();
    montarChipsStatus();
    renderizarPedidosFiltrados();
  } catch (erro) {
    container.innerHTML = `<div class="vazio"><i class="fa-solid fa-triangle-exclamation"></i>${erro.message}</div>`;
  }
}

function montarResumoConta() {
  const fmt = v => Number(v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  const totalGasto = pedidosCliente.reduce((s,p)=>s+Number(p.total||0),0);
  const emAndamento = pedidosCliente.filter(p => ['pendente','processando','enviado'].includes(p.status)).length;
  document.getElementById('resumoConta').innerHTML = `
    <div class="resumo-card"><b>${pedidosCliente.length}</b><span>Pedidos totais</span></div>
    <div class="resumo-card"><b>${emAndamento}</b><span>Em andamento</span></div>
    <div class="resumo-card"><b class="t-sucesso">${fmt(totalGasto)}</b><span>Total gasto</span></div>`;
}

function montarChipsStatus() {
  const status = ['pendente','processando','enviado','entregue','cancelado'];
  const nomes = { pendente:'Pendente', processando:'Em preparo', enviado:'Enviado', entregue:'Entregue', cancelado:'Cancelado' };
  const presentes = status.filter(s => pedidosCliente.some(p => p.status === s));
  const cont = document.getElementById('statusChips');
  cont.innerHTML = `<span class="status-chip ${!statusFiltro?'active':''}" onclick="filtrarStatus('')">Todos</span>` +
    presentes.map(s => `<span class="status-chip ${statusFiltro===s?'active':''}" onclick="filtrarStatus('${s}')">${nomes[s]}</span>`).join('');
}

function filtrarStatus(s) {
  statusFiltro = s;
  montarChipsStatus();
  renderizarPedidosFiltrados();
}

function renderizarPedidosFiltrados() {
  const busca = (document.getElementById('buscaPedido').value || '').toLowerCase().trim();
  let lista = pedidosCliente;
  if (statusFiltro) lista = lista.filter(p => p.status === statusFiltro);
  if (busca) {
    lista = lista.filter(p =>
      p.numero.toLowerCase().includes(busca) ||
      (p.itens||[]).some(i => i.nome.toLowerCase().includes(busca))
    );
  }
  _desenharPedidosCliente(lista);
}

function _desenharPedidosCliente(pedidos) {
  const container = document.getElementById('listaPedidosCliente');
  const fmt = v => Number(v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  const statusNome = { pendente:'Pendente', processando:'Em preparo', enviado:'Enviado', entregue:'Entregue', cancelado:'Cancelado' };
  const ordem = ['pendente','processando','enviado','entregue'];

  if (pedidosCliente.length === 0) {
    container.innerHTML = `<div class="vazio"><i class="fa-solid fa-bag-shopping"></i>Você ainda não fez nenhum pedido.<br><a href="loja.html" class="t-destaque">Ver produtos da loja →</a></div>`;
    return;
  }
  if (pedidos.length === 0) {
    container.innerHTML = `<div class="vazio"><i class="fa-solid fa-magnifying-glass"></i>Nenhum pedido encontrado com esse filtro.</div>`;
    return;
  }

  container.innerHTML = pedidos.map((p,idx) => {
    const passo = p.status === 'cancelado' ? -1 : ordem.indexOf(p.status);
    const barras = ordem.map((s,i) => `<div class="progress-seg ${p.status==='cancelado'?'cancelado':(i<=passo?'ativo':'')}"></div>`).join('');
    return `
    <div class="pedido-card" onclick="alternarItensPedido(${idx})">
      <div class="pedido-card-topo">
        <div>
          <span class="pedido-numero">Pedido #${p.numero}</span>
          <div class="pedido-data">${p.data ? new Date(p.data).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}) : ''}</div>
        </div>
        <span class="pedido-status st-${p.status}">${statusNome[p.status]||p.status}</span>
      </div>
      ${p.status!=='cancelado' ? `<div class="progress-track">${barras}</div>` : ''}
      <div class="pedido-itens">${(p.itens||[]).map(i => `${i.nome} ×${i.quantidade}`).join(' · ')}</div>
      <div class="pedido-itens-lista" id="itensPedido${idx}">
        ${(p.itens||[]).map(i => `<div class="pedido-item-linha"><span>${i.nome} ×${i.quantidade}</span><span>${fmt(i.subtotal ?? (i.precoUnitario*i.quantidade))}</span></div>`).join('')}
        ${p.enderecoEntrega ? `<div class="pedido-item-linha" style="border-bottom:none;color:var(--muted)"><span><i class="fa-solid fa-location-dot"></i> Entrega</span><span>${p.enderecoEntrega}</span></div>` : ''}
      </div>
      <div class="pedido-rodape">
        <span class="pedido-expandir"><i class="fa-solid fa-chevron-down" id="chevron${idx}"></i> Ver itens</span>
        <span class="pedido-total">${fmt(p.total)}</span>
      </div>
    </div>`;
  }).join('');
}

function alternarItensPedido(idx) {
  const el = document.getElementById('itensPedido'+idx);
  const chevron = document.getElementById('chevron'+idx);
  el.classList.toggle('aberto');
  chevron.style.transform = el.classList.contains('aberto') ? 'rotate(180deg)' : 'none';
}

function fazerLogoutConta() {
  lojaLogout();
  document.getElementById('telaConta').style.display = 'none';
  document.getElementById('telaAuth').style.display = '';
  mostrarTab('login');
}
</script>
</body>
</html>
