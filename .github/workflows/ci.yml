name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  testes:
    name: Testes do backend
    runs-on: ubuntu-latest

    # A suíte roda contra um PostgreSQL de verdade — o mesmo banco usado
    # em produção. Testar sobre SQLite deixaria passar diferenças de
    # tipo, transação e concorrência que só apareceriam após o deploy.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestaopro_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/gestaopro_test

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o Prisma Client
        run: npx prisma generate

      # Os segredos JWT da suíte são definidos em tests/setup.js, então
      # o CI não precisa de nenhum secret configurado no repositório.
      - name: Rodar os testes
        run: npm test

      - name: Relatório de cobertura
        run: npm run test:coverage

      - name: Publicar cobertura como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: backend/coverage/
          retention-days: 7
