name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api:
    name: API
    runs-on: ubuntu-latest

    # A suíte roda contra um PostgreSQL de verdade — o mesmo banco usado
    # em produção. Testar sobre SQLite deixaria passar diferenças de
    # tipo, transação e concorrência que só apareceriam após o deploy.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestaopro_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/gestaopro_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o Prisma Client
        run: npx prisma generate

      # Os segredos JWT da suíte são definidos em tests/setup.js, então
      # o CI não precisa de nenhum secret configurado no repositório.
      - name: Testes
        run: npm test

      - name: Cobertura
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-api
          path: backend/coverage/
          retention-days: 7

  interface:
    name: Interface
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      # O build também roda o `tsc -b`. Vale como etapa própria porque o
      # tsc é incremental: um erro de tipo pode passar despercebido no
      # ambiente de quem desenvolve e só aparecer numa compilação limpa,
      # que foi exatamente o que já derrubou um deploy.
      - name: Build
        run: npm run build
