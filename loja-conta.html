<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Conta — Loja</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#0d0f12;color:#e8eaf0;min-height:100vh;padding:16px}
.container{width:100%;max-width:440px;margin:0 auto}
.container.wide{max-width:640px}
.center-wrap{min-height:calc(100vh - 32px);display:flex;align-items:center;justify-content:center}
.logo{text-align:center;margin-bottom:24px}
.logo-icon{width:52px;height:52px;background:#4f8ef7;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;margin:0 auto 10px}
.logo h1{font-size:20px;font-weight:700}
.logo p{font-size:13px;color:#8b93a7}
.card{background:#1e2430;border:1px solid #2a3040;border-radius:12px;padding:28px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.tabs{display:flex;gap:0;margin-bottom:24px;background:#161a20;border-radius:8px;padding:4px}
.tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:500;cursor:pointer;border-radius:6px;border:none;background:transparent;color:#8b93a7;transition:all .2s}
.tab.active{background:#4f8ef7;color:#fff}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.form-group label{font-size:12px;font-weight:500;color:#8b93a7}
input{background:#161a20;border:1px solid #2a3040;color:#e8eaf0;padding:10px 12px;border-radius:8px;font-size:13px;font-family:inherit;width:100%;transition:border-color .2s}
input:focus{outline:none;border-color:#4f8ef7}
input::placeholder{color:#555e70}
input.erro{border-color:#f87171}
.btn{width:100%;padding:11px;border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-primary{background:#4f8ef7;color:#fff}
.btn-primary:hover{background:#3a7aee;transform:translateY(-1px)}
.btn-primary:disabled{background:#555e70;cursor:not-allowed;transform:none}
.btn-secundario{background:transparent;color:#8b93a7;border:1px solid #2a3040}
.btn-secundario:hover{background:#252d3a;color:#e8eaf0}
.msg-erro{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:#f87171;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.msg-ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);color:#34d399;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.voltar{text-align:center;margin-top:16px;font-size:13px;color:#8b93a7}
.voltar a{color:#4f8ef7;text-decoration:none}

/* PEDIDOS */
.topo-conta{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.topo-conta h2{font-size:18px;font-weight:700}
.pedido-card{background:#161a20;border:1px solid #2a3040;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.pedido-card-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pedido-numero{font-weight:700;color:#4f8ef7;font-size:14px}
.pedido-status{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600}
.st-pendente{background:rgba(251,191,36,.15);color:#fbbf24}
.st-processando{background:rgba(79,142,247,.15);color:#4f8ef7}
.st-enviado{background:rgba(79,142,247,.15);color:#4f8ef7}
.st-entregue{background:rgba(52,211,153,.15);color:#34d399}
.st-cancelado{background:rgba(248,113,113,.15);color:#f87171}
.pedido-itens{font-size:12px;color:#8b93a7;margin-bottom:8px;line-height:1.5}
.pedido-rodape{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.pedido-total{font-weight:700;color:#34d399}
.vazio{text-align:center;padding:40px 20px;color:#8b93a7;font-size:13px}
.vazio i{font-size:36px;display:block;margin-bottom:12px;opacity:.3}
</style>
</head>
<body>

<!-- ═══════════ TELA DE LOGIN / CADASTRO (cliente deslogado) ═══════════ -->
<div class="center-wrap" id="telaAuth">
<div class="container">
  <div class="logo">
    <div class="logo-icon"><i class="fa-solid fa-bag-shopping"></i></div>
    <h1>GestãoPro Loja</h1>
    <p>Acesse sua conta para finalizar a compra</p>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="mostrarTab('login')">Entrar</button>
      <button class="tab" id="tabCadastro" onclick="mostrarTab('cadastro')">Criar conta</button>
    </div>

    <!-- LOGIN -->
    <div id="painelLogin">
      <div class="msg-erro" id="erroLogin"></div>
      <div class="form-group"><label>E-mail</label><input type="email" id="loginEmail" placeholder="seu@email.com"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="loginSenha" placeholder="••••••••"></div>
      <button class="btn btn-primary" id="btnLogin" onclick="fazerLogin()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar</button>
    </div>

    <!-- CADASTRO -->
    <div id="painelCadastro" style="display:none">
      <div class="msg-erro" id="erroCadastro"></div>
      <div class="msg-ok"   id="okCadastro"></div>
      <div class="form-group"><label>Nome completo</label><input type="text" id="cadNome" placeholder="Seu nome"></div>
      <div class="form-group"><label>E-mail</label><input type="email" id="cadEmail" placeholder="seu@email.com"></div>
      <div class="form-group"><label>Telefone</label><input type="text" id="cadTelefone" placeholder="(00) 00000-0000"></div>
      <div class="form-group"><label>CPF</label><input type="text" id="cadCpf" placeholder="000.000.000-00"></div>
      <div class="form-group"><label>Endereço de entrega</label><input type="text" id="cadEndereco" placeholder="Rua, número, bairro, cidade"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="cadSenha" placeholder="Mínimo 6 caracteres"></div>
      <button class="btn btn-primary" id="btnCadastro" onclick="fazerCadastro()"><i class="fa-solid fa-user-plus"></i> Criar conta</button>
    </div>
  </div>
  <div class="voltar"><a href="loja.html"><i class="fa-solid fa-arrow-left"></i> Voltar à loja</a></div>
</div>
</div>

<!-- ═══════════ TELA "MINHA CONTA" (cliente logado) ═══════════ -->
<div class="container wide" id="telaConta" style="display:none;padding-top:24px">
  <div class="topo-conta">
    <div>
      <h2 id="contaNomeCliente">Minha conta</h2>
      <p style="font-size:12px;color:#8b93a7" id="contaEmailCliente"></p>
    </div>
    <div style="display:flex;gap:8px">
      <a class="btn btn-secundario" href="loja.html" style="width:auto;padding:9px 14px"><i class="fa-solid fa-bag-shopping"></i> Loja</a>
      <button class="btn btn-secundario" style="width:auto;padding:9px 14px" onclick="fazerLogoutConta()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
    </div>
  </div>

  <h3 style="font-size:14px;font-weight:600;margin-bottom:12px;color:#8b93a7">Meus pedidos</h3>
  <div id="listaPedidosCliente"></div>
</div>

<script src="js/config.js"></script>
<script src="js/loja-api.js"></script>
<script>
// ======================================
// CONTA DO CLIENTE — LOGIN / CADASTRO / PEDIDOS
// ======================================
// Antes, login e cadastro gravavam direto em localStorage ('loja_clientes'),
// com a senha em texto puro, e nunca passavam pelo backend. Agora tudo usa
// POST /api/loja/auth/registrar e /api/loja/auth/login, que fazem o hash da
// senha (bcrypt) e devolvem um token JWT próprio da loja.

const REDIRECT = sessionStorage.getItem('loja_redirect') || 'loja.html';

document.addEventListener('DOMContentLoaded', () => {
  if (lojaClienteLogado()) {
    mostrarTelaConta();
  } else {
    document.getElementById('telaAuth').style.display = '';
  }
});

function mostrarTab(t) {
  document.getElementById('painelLogin').style.display   = t==='login'    ? '' : 'none';
  document.getElementById('painelCadastro').style.display= t==='cadastro' ? '' : 'none';
  document.getElementById('tabLogin').classList.toggle('active',   t==='login');
  document.getElementById('tabCadastro').classList.toggle('active', t==='cadastro');
}

function erroMsg(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

async function fazerLogin() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const senha = document.getElementById('loginSenha').value.trim();
  erroMsg('erroLogin','');
  if (!email || !senha) { erroMsg('erroLogin','Preencha e-mail e senha.'); return; }

  const btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';

  try {
    await lojaLogin(email, senha);
    // Se veio do carrinho, volta direto pra loja; senão, mostra a conta aqui mesmo.
    if (sessionStorage.getItem('loja_redirect')) {
      window.location.href = REDIRECT;
    } else {
      mostrarTelaConta();
    }
  } catch (erro) {
    erroMsg('erroLogin', erro.message || 'E-mail ou senha incorretos.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar';
  }
}

function mascaraTel(el) {
  let v = el.value.replace(/\D/g,'').slice(0,11);
  if (v.length>6) v=`(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
  else if (v.length>2) v=`(${v.slice(0,2)}) ${v.slice(2)}`;
  else if (v.length>0) v=`(${v}`;
  el.value = v;
}
function mascaraCPF(el) {
  let v = el.value.replace(/\D/g,'').slice(0,11);
  if(v.length>9) v=`${v.slice(0,3)}.${v.slice(3,6)}.${v.slice(6,9)}-${v.slice(9)}`;
  else if(v.length>6) v=`${v.slice(0,3)}.${v.slice(3,6)}.${v.slice(6)}`;
  else if(v.length>3) v=`${v.slice(0,3)}.${v.slice(3)}`;
  el.value=v;
}
document.getElementById('cadTelefone').addEventListener('input', function(){ mascaraTel(this); });
document.getElementById('cadCpf').addEventListener('input', function(){ mascaraCPF(this); });

async function fazerCadastro() {
  const nome     = document.getElementById('cadNome').value.trim();
  const email    = document.getElementById('cadEmail').value.trim().toLowerCase();
  const telefone = document.getElementById('cadTelefone').value.trim();
  const cpf      = document.getElementById('cadCpf').value.trim();
  const endereco = document.getElementById('cadEndereco').value.trim();
  const senha    = document.getElementById('cadSenha').value.trim();

  erroMsg('erroCadastro','');
  erroMsg('okCadastro','');

  if (!nome||!email||!senha) { erroMsg('erroCadastro','Nome, e-mail e senha são obrigatórios.'); return; }
  if (senha.length < 6)      { erroMsg('erroCadastro','Senha deve ter pelo menos 6 caracteres.'); return; }

  const btn = document.getElementById('btnCadastro');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Criando conta...';

  try {
    // O backend já cuida de unificar com um cliente cadastrado manualmente
    // no painel com o mesmo e-mail (em vez de criar um registro duplicado).
    await lojaRegistrar({ nome, email, telefone, cpf, endereco, senha });

    const okEl = document.getElementById('okCadastro');
    okEl.textContent = 'Conta criada com sucesso! Redirecionando…';
    okEl.style.display = 'block';
    setTimeout(() => {
      if (sessionStorage.getItem('loja_redirect')) {
        window.location.href = REDIRECT;
      } else {
        mostrarTelaConta();
      }
    }, 1000);
  } catch (erro) {
    erroMsg('erroCadastro', erro.message || 'Não foi possível criar a conta.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Criar conta';
  }
}

document.getElementById('loginSenha').addEventListener('keypress', e => { if(e.key==='Enter') fazerLogin(); });

// ─── TELA "MINHA CONTA" / PEDIDOS ────────

async function mostrarTelaConta() {
  document.getElementById('telaAuth').style.display = 'none';
  document.getElementById('telaConta').style.display = '';

  let cliente = lojaCarregarCliente();
  try {
    cliente = await lojaCarregarPerfil(); // dados sempre atualizados do banco
  } catch {
    // token expirado/inválido: volta para a tela de login
    lojaLogout();
    document.getElementById('telaConta').style.display = 'none';
    document.getElementById('telaAuth').style.display = '';
    return;
  }

  document.getElementById('contaNomeCliente').textContent = `Olá, ${cliente.nome.split(' ')[0]}`;
  document.getElementById('contaEmailCliente').textContent = cliente.email;

  await carregarPedidosCliente();
}

async function carregarPedidosCliente() {
  const container = document.getElementById('listaPedidosCliente');
  try {
    const pedidos = await lojaMeusPedidos();
    _desenharPedidosCliente(pedidos);
  } catch (erro) {
    container.innerHTML = `<div class="vazio"><i class="fa-solid fa-triangle-exclamation"></i>${erro.message}</div>`;
  }
}

function _desenharPedidosCliente(pedidos) {
  const container = document.getElementById('listaPedidosCliente');
  const fmt = v => Number(v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  const statusNome = { pendente:'Pendente', processando:'Em preparo', enviado:'Enviado', entregue:'Entregue', cancelado:'Cancelado' };

  if (pedidos.length === 0) {
    container.innerHTML = `<div class="vazio"><i class="fa-solid fa-bag-shopping"></i>Você ainda não fez nenhum pedido.</div>`;
    return;
  }

  container.innerHTML = pedidos.map(p => `
    <div class="pedido-card">
      <div class="pedido-card-topo">
        <span class="pedido-numero">Pedido #${p.numero}</span>
        <span class="pedido-status st-${p.status}">${statusNome[p.status]||p.status}</span>
      </div>
      <div class="pedido-itens">${(p.itens||[]).map(i => `${i.nome} ×${i.quantidade}`).join(' · ')}</div>
      <div class="pedido-rodape">
        <span style="color:#8b93a7">${p.data ? new Date(p.data).toLocaleDateString('pt-BR') : ''}</span>
        <span class="pedido-total">${fmt(p.total)}</span>
      </div>
    </div>
  `).join('');
}

function fazerLogoutConta() {
  lojaLogout();
  document.getElementById('telaConta').style.display = 'none';
  document.getElementById('telaAuth').style.display = '';
  mostrarTab('login');
}
</script>
</body>
</html>
