<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Sistema de gestão empresarial com loja virtual integrada." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>GESTIQ</title>
    <script>
      // Aplica o tema antes de qualquer pixel ser desenhado. Se isto
      // esperasse o React montar, quem escolheu o tema escuro veria um
      // clarão branco a cada carregamento.
      (function () {
        try {
          var salvo = localStorage.getItem('gestiq_tema');
          var tema =
            salvo === 'claro' || salvo === 'escuro'
              ? salvo
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'claro'
                : 'escuro';
          document.documentElement.dataset.tema = tema;
          document.documentElement.style.colorScheme = tema === 'claro' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.dataset.tema = 'escuro';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
